version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fake-news-backend
    ports:
      - "5000:5000"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fake-news-frontend
    ports:
      - "3000:3000"
    restart: always
    environment:
      # This will be available in Next.js as process.env.NEXT_PUBLIC_API_URL
      NEXT_PUBLIC_API_URL: "http://backend:5000"
    depends_on:
      - backend
